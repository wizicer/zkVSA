[package]
name = "wav_pitchshift"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
rustfft = "6.4.0"
ark-ff = "0.4"
ark-ff-optimized = "0.4.1"
ark-bls12-377 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
claxon = "0.4"
rayon = "1.8"
flacenc = "0.5"
num-bigint = "0.4"
anyhow = "1"